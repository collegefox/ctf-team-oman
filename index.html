<style>

const vis=c.term?`<div class="term">${SH}<pre id="tout">Last login: Thu Nov 19\nاكتب 'ls' لعرض الملفات، و'help' لعرض كل الأوامر المتاحة.</pre><div class="tin-row"><span>user@host:~$</span><input id="tin" autocomplete="off" ${fin?'disabled':''}></div></div>`:`<div class="term">${SH}<pre>${c.ev.join('\n')}</pre></div>`;
$('#md').style.setProperty('--c',t.c);$('#md').innerHTML=`<h3>${c.ic} ${c.t} <small style="color:${t.c};font-size:14px">(${P[i]} نقطة)</small></h3><p class="sc">${c.sc}</p>${vis}<div class="q">${c.q}</div><div class="row"><input id="an" placeholder="اكتب الإجابة هنا" autocomplete="off" ${fin?'disabled':''}><button class="btn" id="go" ${fin?'disabled':''}>تحقق</button><button class="btn g" id="hn">تلميح (−3)</button><button class="btn g" id="cl">إغلاق</button></div><div class="hint" id="ht">${S.h[id]?'💡 '+c.h:''}</div><div class="msg" id="ms">${fin?'✔ تم حل هذا التحدي':''}</div>`;
$('#ov').classList.add('on');const an=$('#an');if(!fin)an.focus();
if(c.term&&!fin){let cwd='/home/user';const fs=c.fs,tout=$('#tout'),tin=$('#tin');
  const pr=s=>{tout.textContent+=(tout.textContent?'\n':'')+s;tout.scrollTop=tout.scrollHeight};
  const rp=p=>{if(!p||p==='~')return '/home/user';if(p.startsWith('/'))return p.replace(/\/$/,'');return (cwd+'/'+p).replace(/\/$/,'')};
  tin.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const raw=tin.value.trim();tin.value='';pr('user@host:'+cwd+'$ '+raw);if(!raw)return;
    const[cmd,...args]=raw.split(/\s+/);
    if(cmd==='help')pr('الأوامر: ls, cd <مجلد>, cat <ملف>, pwd, grep <نص> <ملف>, clear');
    else if(cmd==='pwd')pr(cwd);
    else if(cmd==='ls'){const d=fs[rp(args[0]||cwd)];pr(d&&d.type==='dir'?d.children.join('  '):'ls: المسار غير موجود')}
    else if(cmd==='cd'){const np=rp(args[0]);if(fs[np]&&fs[np].type==='dir')cwd=np;else pr('cd: المسار غير موجود')}
    else if(cmd==='cat'){const f=fs[rp(args[0])];pr(f&&f.type==='file'?f.content:'cat: ملف غير موجود')}
    else if(cmd==='grep'){const term=args[0],f=fs[rp(args[1])];if(f&&f.type==='file'){const hit=f.content.split('\n').filter(l=>l.includes(term));pr(hit.length?hit.join('\n'):'لا نتائج')}else pr('grep: ملف غير موجود')}
    else if(cmd==='clear')tout.textContent='';
    else pr(cmd+': أمر غير معروف (جرّب help)');
  });
}
const close=()=>{$('#ov').classList.remove('on');track(k)};$('#cl').onclick=close;
$('#hn').onclick=()=>{S.h[id]=1;save();$('#ht').textContent='💡 '+c.h};
const chk=()=>{if(fin)return;const v=an.value.toLowerCase().replace(/\s+/g,' ').trim();const m=$('#ms');
if(c.a.includes(v)){const p=P[i]-(S.h[id]?3:0);solve(k,i,p);m.style.color='var(--ok)';m.textContent='🎉 إجابة صحيحة! +'+p+' نقطة';hdr();an.disabled=true;$('#go').disabled=true}else{m.style.color='var(--r)';m.textContent='إجابة غير صحيحة، حاول مرة أخرى.'}};
$('#go').onclick=chk;an.onkeydown=e=>{if(e.key==='Enter')chk()}}
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#cl')&&$('#cl').click()};
document.onkeydown=e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))$('#cl').click()};
function setTh(m,s){document.documentElement.dataset.theme=m;
['dark','light','duel'].forEach(x=>{const b=$('#th-'+x);if(b)b.classList.toggle('on',x===m)});
if(s)try{localStorage.setItem('ctfth',m)}catch(e){}}
let tm='dark';try{tm=localStorage.getItem('ctfth')||'dark'}catch(e){}
setTh(tm);$('#vs').onclick=vsPage;$('#adm').onclick=adminPage;$('#tl').onclick=toolsPage;
['dark','light','duel'].forEach(x=>$('#th-'+x).onclick=()=>setTh(x,1));
$('#rs').onclick=()=>{if(!confirm('هل تريد مسح كل التقدم؟'))return;S={d:{},h:{}};save();
  if(SHARE&&DBr){['b','r'].forEach(k=>{
    if(MODE==='claude') DBr.doc('teams/'+k).set({d:{}}).catch(()=>{});
    else if(MODE==='fb') DBr.collection('teams').doc(k).set({d:{}}).catch(()=>{});
  })}
  home()};
const vo=$('#vo'),vv=$('#vv');
const vClose=()=>{vv.pause();vo.classList.remove('on')};
$('#pv').onclick=()=>{vo.classList.add('on');vv.currentTime=0;vv.play().catch(()=>{})};
$('#vcl').onclick=vClose;vo.onclick=e=>{if(e.target===vo)vClose()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&vo.classList.contains('on'))vClose()});
home();initDB();
</script></body></html>
